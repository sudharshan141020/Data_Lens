services:
  - type: web
    name: sales-insights-ledger
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Render restarts the service if this stops answering, and waits for it before switching traffic.
    healthCheckPath: /api/health
    envVars:
      # Same minor version CI tests on (.github/workflows/ci.yml); without it Render picks its own default.
      - key: PYTHON_VERSION
        value: 3.12.7
      # The free plan has 512 MB of RAM and the app needs ~200 MB just to start. Measured peak memory:
      # 50,000 rows ~355 MB, 200,000 rows (12.7 MB CSV) ~397 MB, 500,000 rows (31.8 MB) ~620 MB, which
      # crashes the instance and wipes every in-memory share link. 10 MB keeps a safe margin; raise it
      # on a bigger plan. (The app's own default is 250 MB, which suits running it locally.)
      - key: DATALENS_MAX_FILE_MB
        value: "10"
      # Who the share endpoints' rate limits (and the per-client share-cache quota) count
      # against. Render's proxy is the socket peer and appends the caller's address to
      # X-Forwarded-For; with the app's default of 0 every visitor would share one
      # 30-creates/120-reads-a-minute budget and one client's cache quota. Raise this if
      # another proxy you control is put in front (app/rate_limit.py explains which end of
      # the header is read, and why it is not the left-most value).
      - key: DATALENS_TRUSTED_PROXIES
        value: "1"
